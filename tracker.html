<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker</title>

    <link rel="stylesheet" href="/css/tracker.css">
</head>
<body>

    <main class="tracker-container">

        <div class="tracker-card">

            <h1>📍 Suivi Actif</h1>

            <div class="status">
                🟢 GPS connecté
            </div>

            <div class="info">
                <p id="latitude">
                    Latitude : --
                </p>

                <p id="longitude">
                    Longitude : --
                </p>

                <p id="accuracy">
                    Précision : --
                </p>

                <p id="last-update">
                    Dernière mise à jour : --
                </p>
            </div>

        </div>

    </main>

    <script src="/js/tracker.js"></script>

</body>
</html>
